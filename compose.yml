services:
  client:
    build: front/client
    container_name: client
    ports:
      - "5173:5173"
    depends_on:
      - server
    environment:
      - VITE_SOCKET_URL=http://server:3001
      - API_PROXY_TARGET=http://api:3000

  server:
    build: front/server
    container_name: server
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
    
  admin:
    build: admin
    container_name: admin
    ports:
      - "81:81"
    depends_on:
      - api

  api:
    build: api
    container_name: api
    ports:
      - "3000:3000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/zvejyba
    volumes:
      - ./api/public/images:/app/public/images
    depends_on:
      - mongodb

  mongodb:
    image: mongo:8
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d

volumes:
  mongodb_data:
