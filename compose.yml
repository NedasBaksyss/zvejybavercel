services:
  front:
    build: front
    container_name: front
    ports:
      - "5173:5173"
    depends_on:
      - api
    
  admin:
    build: admin
    container_name: admin
    ports:
      - "81:81"
    depends_on:
      - api

  api:
    build: api
    container_name: api
    ports:
      - "3000:3000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/zvejyba
    depends_on:
      - mongodb

  mongodb:
    image: mongo:8
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d

volumes:
  mongodb_data: